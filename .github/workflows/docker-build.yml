
name: Nexvion Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nexvion-website:ci .

      - name: Start website container
        run: docker run -d --name nexvion-test -p 8080:80 nexvion-website:ci

      - name: Test website HTTP response
        run: |
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://localhost:8080/
          curl --fail http://localhost:8080/products.html
          curl --fail http://localhost:8080/payment.html

      - name: Display container logs if needed
        if: failure()
        run: docker logs nexvion-test || true

      - name: Stop test container
        if: always()
        run: docker rm -f nexvion-test || true
